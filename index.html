<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑 리스트</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
  }
  .container {
    background: #fff;
    width: 100%;
    max-width: 480px;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    padding: 28px;
  }
  h1 {
    font-size: 24px;
    color: #333;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .subtitle {
    color: #888;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  #itemInput {
    flex: 1;
    padding: 12px 14px;
    border: 2px solid #e5e7eb;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
  }
  #itemInput:focus { border-color: #667eea; }
  #addBtn {
    padding: 0 20px;
    background: #667eea;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  #addBtn:hover { background: #5568d3; }
  #addBtn:active { background: #4856b8; }
  .stats {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #666;
    margin-bottom: 12px;
    padding: 0 4px;
  }
  .clear-btn {
    background: none;
    border: none;
    color: #ef4444;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
  }
  .clear-btn:hover { text-decoration: underline; }
  .clear-btn:disabled { color: #ccc; cursor: not-allowed; text-decoration: none; }
  ul { list-style: none; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: #f9fafb;
    border-radius: 10px;
    margin-bottom: 8px;
    transition: background 0.15s;
  }
  li:hover { background: #f3f4f6; }
  li input[type="checkbox"] {
    width: 20px;
    height: 20px;
    cursor: pointer;
    accent-color: #667eea;
    flex-shrink: 0;
  }
  li .text {
    flex: 1;
    font-size: 15px;
    color: #333;
    word-break: break-word;
  }
  li.done .text {
    text-decoration: line-through;
    color: #aaa;
  }
  .delete-btn {
    background: none;
    border: none;
    color: #ef4444;
    cursor: pointer;
    font-size: 18px;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.15s;
  }
  .delete-btn:hover { background: #fee2e2; }
  .empty {
    text-align: center;
    color: #aaa;
    padding: 40px 0;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>🛒 쇼핑 리스트</h1>
    <p class="subtitle">필요한 물건을 추가하고 체크해보세요</p>

    <div class="input-row">
      <input type="text" id="itemInput" placeholder="추가할 아이템 입력..." maxlength="60" autofocus>
      <button id="addBtn">추가</button>
    </div>

    <div class="stats">
      <span id="counter">전체 0개 · 완료 0개</span>
      <button class="clear-btn" id="clearBtn">완료 항목 삭제</button>
    </div>

    <ul id="list"></ul>
  </div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'https://ymotawrqfjszzojpbeie.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_lIk88NinoDWlYppJjp8Nfw_nXF-QHcD';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const input = document.getElementById('itemInput');
  const addBtn = document.getElementById('addBtn');
  const list = document.getElementById('list');
  const counter = document.getElementById('counter');
  const clearBtn = document.getElementById('clearBtn');

  let items = [];

  async function loadItems() {
    const { data, error } = await supabase
      .from('shopping_items')
      .select('*')
      .order('created_at', { ascending: true });
    if (error) {
      console.error('아이템 로드 실패:', error);
      return [];
    }
    return data ?? [];
  }

  function render() {
    list.innerHTML = '';

    if (items.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '아직 추가된 아이템이 없어요';
      list.appendChild(empty);
    } else {
      items.forEach(item => {
        const li = document.createElement('li');
        if (item.done) li.classList.add('done');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = item.done;
        checkbox.addEventListener('change', () => toggleItem(item.id));

        const text = document.createElement('span');
        text.className = 'text';
        text.textContent = item.text;

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = '✕';
        delBtn.title = '삭제';
        delBtn.addEventListener('click', () => deleteItem(item.id));

        li.appendChild(checkbox);
        li.appendChild(text);
        li.appendChild(delBtn);
        list.appendChild(li);
      });
    }

    const doneCount = items.filter(i => i.done).length;
    counter.textContent = `전체 ${items.length}개 · 완료 ${doneCount}개`;
    clearBtn.disabled = doneCount === 0;
  }

  async function addItem() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.focus();

    const { data, error } = await supabase
      .from('shopping_items')
      .insert({ text, done: false })
      .select()
      .single();
    if (error) {
      console.error('아이템 추가 실패:', error);
      return;
    }
    items.push(data);
    render();
  }

  async function toggleItem(id) {
    const item = items.find(i => i.id === id);
    if (!item) return;
    const nextDone = !item.done;
    item.done = nextDone;
    render();

    const { error } = await supabase
      .from('shopping_items')
      .update({ done: nextDone })
      .eq('id', id);
    if (error) {
      console.error('아이템 업데이트 실패:', error);
      item.done = !nextDone;
      render();
    }
  }

  async function deleteItem(id) {
    const prev = items;
    items = items.filter(i => i.id !== id);
    render();

    const { error } = await supabase
      .from('shopping_items')
      .delete()
      .eq('id', id);
    if (error) {
      console.error('아이템 삭제 실패:', error);
      items = prev;
      render();
    }
  }

  async function clearDone() {
    const doneIds = items.filter(i => i.done).map(i => i.id);
    if (doneIds.length === 0) return;

    const prev = items;
    items = items.filter(i => !i.done);
    render();

    const { error } = await supabase
      .from('shopping_items')
      .delete()
      .in('id', doneIds);
    if (error) {
      console.error('완료 항목 삭제 실패:', error);
      items = prev;
      render();
    }
  }

  addBtn.addEventListener('click', addItem);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') addItem();
  });
  clearBtn.addEventListener('click', clearDone);

  items = await loadItems();
  render();
</script>
</body>
</html>
